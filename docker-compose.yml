version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextmeal-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist database across container restarts
      - nextmeal-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/nextmeal.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextmeal-frontend
    ports:
      - "8001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nextmeal-data:
    driver: local
